spring.application.name=agriverse1

# -------------------------------------------------------
# Database  (override DB_PASSWORD env-var in production)
# -------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/agriverse1?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:170305}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 7 (Spring Boot 4.x)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Hibernate 7 requires explicit dialect for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=8082

# -------------------------------------------------------
# JWT (override JWT_SECRET env-var in production)
# Secret must be >= 32 chars for HMAC-SHA256
# -------------------------------------------------------
jwt.secret=${JWT_SECRET:AgriverseSecretKeyForJwtAuth2024SecureKeyValue}
jwt.expiration=${JWT_EXPIRATION:86400000}