spring.application.name=agriverse1

# -------------------------------------------------------
# Server
# -------------------------------------------------------
server.port=8082

# -------------------------------------------------------
# Database: MongoDB Atlas (Cloud)
# Set MONGO_PASSWORD env var before running:
#   $env:MONGO_PASSWORD="agrinfo27"; mvn spring-boot:run -DskipTests
# -------------------------------------------------------
spring.data.mongodb.uri=mongodb+srv://agrinfo:${MONGO_PASSWORD}@cluster0.d7ie0fc.mongodb.net/agriverse1?retryWrites=true&w=majority&appName=Cluster0
spring.data.mongodb.auto-index-creation=true

# Increase timeouts so brief network blips don't crash the app
spring.data.mongodb.server-selection-timeout=60000
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.socket-timeout=60000

# -------------------------------------------------------
# JWT (override JWT_SECRET env-var in production)
# Secret must be >= 32 chars for HMAC-SHA256
# -------------------------------------------------------
jwt.secret=${JWT_SECRET:local_dev_jwt_secret_key_1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}