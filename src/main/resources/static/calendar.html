<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriVerse - Crop Sowing Calendar</title>

    <link rel="stylesheet" href="css/calendar.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            🌱 <span>AgriVerse</span>
        </div>

    </header>


    <!-- MAIN CONTENT -->
    <main class="container">


        <h1> Crop Sowing Calendar</h1>

        <p class="subtitle">
            Best sowing & harvest windows for your crops
        </p>


        <!-- MONTH FILTER -->
        <section class="filter-section">

            <h3>Select Month</h3>

            <div class="month-buttons" id="monthButtons">

                <button data-month="Jan">Jan</button>
                <button data-month="Feb">Feb</button>
                <button data-month="Mar">Mar</button>
                <button data-month="Apr">Apr</button>
                <button data-month="May">May</button>
                <button data-month="Jun">Jun</button>
                <button data-month="Jul">Jul</button>
                <button data-month="Aug">Aug</button>
                <button data-month="Sep">Sep</button>
                <button data-month="Oct">Oct</button>
                <button data-month="Nov">Nov</button>
                <button data-month="Dec">Dec</button>

            </div>

        </section>


        <!-- WEATHER FILTER -->
        <section class="filter-section">

            <h3>Weather need</h3>

            <div class="weather-buttons" id="weatherButtons">

                <button data-weather="All" class="selected">
                    All
                </button>

                <button data-weather="Low">
                    Low
                </button>

                <button data-weather="Medium">
                    Medium
                </button>

                <button data-weather="High">
                    High
                </button>

            </div>

        </section>


        <!-- RESULT MESSAGE -->
        <div class="result-message">

            Showing crops for
            <strong id="selectedMonth">Jan</strong>

        </div>


        <!-- CROP CARDS -->
        <section>

            <div class="crop-grid" id="cropContainer">

            </div>

        </section>


        <!-- LEGEND -->
        <div class="legend">

            <span>
                🟢 Green bar = sowing window
            </span>

            <span>
                🟠 Orange bar = harvest window
            </span>

        </div>

    </main>


    <script src="js/calendar.js"></script>

</body>
</html>
