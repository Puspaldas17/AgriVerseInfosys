<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriVerse - Crop Sowing Calendar</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/calendar.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="dashboard.html" class="logo">
            <i class="fas fa-leaf"></i> AgriVerse
        </a>
        <div class="nav-right">
            <a href="dashboard.html" style="text-decoration:none; color:var(--text-main); font-weight:500;"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="hero">
        <h1>Crop Sowing <span>Calendar</span></h1>
        <p>Discover the optimal sowing and harvest windows for your crops based on seasonal requirements.</p>
        <button class="btn-action" style="margin-top: 15px; background-color: var(--primary); padding: 10px 20px; font-weight: 600;" onclick="openSuggestModal()">
            <i class="fas fa-plus"></i> Suggest a Crop
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- FILTERS -->
        <div class="filters-container">
            <div class="filters-inner">
                
                <section class="filter-section">
                    <h3><i class="fas fa-calendar-alt"></i> Select Month</h3>
                    <div class="month-buttons" id="monthButtons">
                        <button data-month="Jan" class="selected">Jan</button>
                        <button data-month="Feb">Feb</button>
                        <button data-month="Mar">Mar</button>
                        <button data-month="Apr">Apr</button>
                        <button data-month="May">May</button>
                        <button data-month="Jun">Jun</button>
                        <button data-month="Jul">Jul</button>
                        <button data-month="Aug">Aug</button>
                        <button data-month="Sep">Sep</button>
                        <button data-month="Oct">Oct</button>
                        <button data-month="Nov">Nov</button>
                        <button data-month="Dec">Dec</button>
                    </div>
                </section>

                <section class="filter-section">
                    <h3><i class="fas fa-cloud-rain"></i> Weather Needs</h3>
                    <div class="weather-buttons" id="weatherButtons">
                        <button data-weather="All" class="selected">All</button>
                        <button data-weather="Low">Low</button>
                        <button data-weather="Medium">Medium</button>
                        <button data-weather="High">High</button>
                    </div>
                </section>

            </div>
        </div>

        <!-- RESULT MESSAGE -->
        <div class="result-message">
            <span>Showing crops for <strong id="selectedMonth">Jan</strong></span>
        </div>

        <!-- CROP CARDS -->
        <section>
            <div class="crop-grid" id="cropContainer">
                <!-- Dynamically loaded -->
            </div>
        </section>

        <!-- LEGEND -->
        <div class="legend">
            <span><div class="legend-color legend-sowing"></div> Sowing Window</span>
            <span><div class="legend-color legend-harvest"></div> Harvest Window</span>
        </div>

    </main>

    <!-- Suggest Crop Modal -->
    <div id="suggestModal" class="modal-overlay" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index:9999; align-items:center; justify-content:center;">
        <div class="modal" style="background: var(--surface); padding: 25px; border-radius: var(--radius-lg); width: 90%; max-width: 500px; border: 1px solid var(--glass-border); box-shadow: var(--shadow-lg);">
            <div class="modal-header" style="margin-bottom: 20px;">
                <h3 style="margin:0; font-family: 'Outfit', sans-serif; font-size: 1.5rem; color: var(--secondary);"><i class="fas fa-seedling"></i> Suggest a Crop</h3>
                <p style="margin: 5px 0 0 0; color: var(--text-muted); font-size: 14px;">Your suggestion will be reviewed by an administrator.</p>
            </div>
            <div class="modal-body">
                <form id="suggestForm" style="display: flex; flex-direction: column; gap: 15px;">
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="suggCropName" placeholder="Crop Name (e.g. Wheat)" style="flex:1; padding:12px; background:var(--bg-body); border:1px solid var(--border); color:var(--text-main); border-radius:8px;" required>
                        <input type="text" id="suggCropSeason" placeholder="Season (e.g. Rabi)" style="flex:1; padding:12px; background:var(--bg-body); border:1px solid var(--border); color:var(--text-main); border-radius:8px;" required>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <select id="suggSowingStart" style="flex:1; padding:12px; background:var(--bg-body); border:1px solid var(--border); color:var(--text-main); border-radius:8px;" required>
                            <option value="" disabled selected>Sowing Start</option>
                            <option value="January">January</option><option value="February">February</option><option value="March">March</option><option value="April">April</option><option value="May">May</option><option value="June">June</option><option value="July">July</option><option value="August">August</option><option value="September">September</option><option value="October">October</option><option value="November">November</option><option value="December">December</option>
                        </select>
                        <select id="suggSowingEnd" style="flex:1; padding:12px; background:var(--bg-body); border:1px solid var(--border); color:var(--text-main); border-radius:8px;" required>
                            <option value="" disabled selected>Sowing End</option>
                            <option value="January">January</option><option value="February">February</option><option value="March">March</option><option value="April">April</option><option value="May">May</option><option value="June">June</option><option value="July">July</option><option value="August">August</option><option value="September">September</option><option value="October">October</option><option value="November">November</option><option value="December">December</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <select id="suggHarvestStart" style="flex:1; padding:12px; background:var(--bg-body); border:1px solid var(--border); color:var(--text-main); border-radius:8px;" required>
                            <option value="" disabled selected>Harvest Start</option>
                            <option value="January">January</option><option value="February">February</option><option value="March">March</option><option value="April">April</option><option value="May">May</option><option value="June">June</option><option value="July">July</option><option value="August">August</option><option value="September">September</option><option value="October">October</option><option value="November">November</option><option value="December">December</option>
                        </select>
                        <select id="suggHarvestEnd" style="flex:1; padding:12px; background:var(--bg-body); border:1px solid var(--border); color:var(--text-main); border-radius:8px;" required>
                            <option value="" disabled selected>Harvest End</option>
                            <option value="January">January</option><option value="February">February</option><option value="March">March</option><option value="April">April</option><option value="May">May</option><option value="June">June</option><option value="July">July</option><option value="August">August</option><option value="September">September</option><option value="October">October</option><option value="November">November</option><option value="December">December</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <select id="suggCropWater" style="flex:1; padding:12px; background:var(--bg-body); border:1px solid var(--border); color:var(--text-main); border-radius:8px;" required>
                            <option value="" disabled selected>Water Need</option>
                            <option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option>
                        </select>
                        <input type="text" id="suggCropSoil" placeholder="Soil Type (e.g. Loamy)" style="flex:1; padding:12px; background:var(--bg-body); border:1px solid var(--border); color:var(--text-main); border-radius:8px;" required>
                    </div>
                    <textarea id="suggCropDesc" placeholder="Description & Tips..." style="width:100%; height:80px; padding:12px; background:var(--bg-body); border:1px solid var(--border); color:var(--text-main); border-radius:8px; font-family:inherit; resize:vertical;"></textarea>
                </form>
            </div>
            <div class="modal-footer" style="margin-top:20px; display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-cancel" onclick="closeSuggestModal()" type="button" style="padding:10px 20px; border-radius:8px; background:transparent; border:1px solid var(--border); color:var(--text-main); font-weight: 500; cursor:pointer;">Cancel</button>
                <button class="btn-confirm" onclick="submitCropSuggestion()" type="button" style="padding:10px 20px; border-radius:8px; background-color: var(--primary); color:white; border:none; font-weight: 600; cursor:pointer; box-shadow: var(--shadow-colored);">Submit Suggestion</button>
            </div>
        </div>
    </div>


    <script src="js/calendar.js"></script>

</body>
</html>
