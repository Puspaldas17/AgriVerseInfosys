<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriVerse Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

background:linear-gradient(135deg,#d4fc79,#96e6a1);

}

.login-container{

width:950px;
background:#fff;
display:flex;
border-radius:20px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.15);

}

.login-left{

width:45%;
background:linear-gradient(135deg,#1B5E20,#43A047);
color:#fff;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px;
text-align:center;

}

.login-left i{

font-size:90px;
margin-bottom:20px;

}

.login-left h1{

font-size:38px;
margin-bottom:15px;

}

.login-left p{

font-size:17px;
line-height:30px;

}

.features{

margin-top:30px;
text-align:left;

}

.features p{

margin:12px 0;
font-size:15px;

}

.login-right{

width:55%;
padding:45px;

}

.login-logo{

text-align:center;
margin-bottom:25px;

}

.login-logo h2{

color:#2E7D32;
font-size:36px;

}

.login-logo p{

color:#777;

}

.tabs{

display:flex;
background:#edf2ed;
border-radius:10px;
overflow:hidden;
margin-bottom:25px;

}

.tabs button{

width:50%;
padding:13px;
border:none;
cursor:pointer;
font-size:16px;

}

.active{

background:#2E7D32;
color:#fff;

}

.input-box{

position:relative;
margin-bottom:18px;

}

.input-box input{

width:100%;
padding:14px 45px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
outline:none;

}

.input-box i{

position:absolute;
left:15px;
top:16px;
color:#2E7D32;

}

.login-btn{

width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#28a745;
color:#fff;
font-size:18px;
cursor:pointer;
transition:.3s;

}

.login-btn:hover{

background:#1f7d35;

}

.or{

text-align:center;
margin:20px 0;
color:#777;
font-weight:600;

}

.guest{

width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
background:#fff;
cursor:pointer;
font-size:16px;

}

.demo{

text-align:center;
margin:25px 0 15px;
font-weight:600;
color:#777;

}

.roles{

display:flex;
gap:15px;

}

.roles button{

flex:1;
padding:12px;
border-radius:10px;
cursor:pointer;
font-size:15px;
border:1px solid #ddd;

}

.vet{

color:#1565C0;

}

.admin{

color:#8E24AA;

}

.footer{

margin-top:20px;
font-size:13px;
text-align:center;
color:#888;

}

@media(max-width:900px){

.login-container{

flex-direction:column;
width:95%;

}

.login-left,
.login-right{

width:100%;

}

.login-left{

padding:30px;

}

}

</style>

</head>

<body>

<div class="login-container">

<div class="login-left">

<i class="fas fa-seedling"></i>

<h1>AgriVerse</h1>

<p>
Smart Farming Platform
</p>

<div class="features">

<p>🌾 AI Crop Disease Detection</p>

<p>☁ Weather Forecast</p>

<p>💧 Smart Irrigation</p>

<p>📈 Market Prices</p>

<p>🚜 Government Schemes</p>

<p>🤖 AI Farming Assistant</p>

</div>

</div>

<div class="login-right">

<div class="login-logo">
<h2>AgriVerse</h2>

<p>Smart Farming Assistant</p>

</div>

<div class="tabs">

<button class="active">Login</button>

<button onclick="location.href='signup.html'">Sign Up</button>

</div>

<form id="loginForm">

<div class="input-box">

<i class="fa fa-envelope"></i>

<input 
type="email" 
id="email"
placeholder="farmer@example.com" 
required>
</div>

<div class="input-box">

<i class="fa fa-lock"></i>

<input 
type="password" 
id="password"
placeholder="Password" 
required>

</div>

<button class="login-btn">Login</button>

</form>

<div class="or">OR CONTINUE AS</div>

<button class="guest">

<i class="fa fa-user"></i>

Continue as Guest

</button>

<div class="demo">

QUICK DEMO ACCESS

</div>

<div class="roles">

<button class="vet">

<i class="fa fa-stethoscope"></i>

Login as Vet

</button>

<button class="admin">

<i class="fa fa-user-shield"></i>

Login as Admin

</button>

</div>

<div class="footer">

Accounts are created & stored in the database automatically.

</div>

</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;


    let response = await fetch("http://localhost:8082/api/auth/login", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body: JSON.stringify({
            email: email,
            password: password
        })

    });


    if(response.ok){

        let data = await response.json();

        localStorage.setItem("token", data.token);

        alert("Login Successful");

        window.location="index.html";

    }
    else{

        alert("Invalid Email or Password");

    }


});

</script>
</body>
</html>
