<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVerse - My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #052e16 0%, #065f46 40%, #0f4c35 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .profile-card {
            width: 560px;
            max-width: 100%;
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 40px 38px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.1);
            position: relative;
        }

        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.85);
            border-radius: 24px;
            justify-content: center;
            align-items: center;
            z-index: 10;
            flex-direction: column;
            gap: 14px;
        }
        .loading-overlay.show { display: flex; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #d1fae5;
            border-top-color: #16a34a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #15803d; font-weight: 600; font-size: 14px; }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: #15803d;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .page-title {
            text-align: center;
            color: #0f172a;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .page-sub {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 28px;
        }

        /* User badge at top */
        .user-badge {
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border: 1px solid #bbf7d0;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 24px;
        }
        .avatar {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: white; font-weight: 700;
            flex-shrink: 0;
        }
        .badge-info { flex: 1; }
        .badge-name { font-weight: 700; color: #14532d; font-size: 15px; }
        .badge-email { color: #4ade80; font-size: 12px; margin-top: 2px; }
        .badge-role {
            background: #16a34a; color: white;
            font-size: 11px; font-weight: 600;
            padding: 3px 10px; border-radius: 20px;
            letter-spacing: 0.5px;
        }

        /* Section label */
        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #94a3b8;
            text-transform: uppercase;
            margin: 20px 0 12px;
        }

        /* Form grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            display: flex; align-items: center; gap: 6px;
        }
        label i { color: #16a34a; font-size: 12px; }

        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', Arial, sans-serif;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        input:focus, select:focus {
            border-color: #16a34a;
            background: white;
            box-shadow: 0 0 0 3px rgba(22,163,74,0.12);
        }
        input[readonly] {
            background: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: 0 4px 14px rgba(22,163,74,0.4);
        }
        .save-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(22,163,74,0.5); }
        .save-btn:active { transform: translateY(0); }
        .save-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Alert messages */
        .alert {
            display: none;
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            align-items: center;
            gap: 8px;
        }
        .alert.show { display: flex; }
        .alert.success {
            background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d;
        }
        .alert.error {
            background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
        }

        .back-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            margin-top: 20px;
            color: #16a34a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #14532d; }

        @media (max-width: 480px) {
            .profile-card { padding: 28px 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: 1; }
        }
    </style>
</head>

<body>
    <div class="profile-card" id="profileCard">

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <span class="loading-text" id="loadingText">Loading your profile...</span>
        </div>

        <div class="logo">🌱 AgriVerse</div>
        <h2 class="page-title">My Profile</h2>
        <p class="page-sub">Your details are saved securely in the cloud</p>

        <!-- User Badge -->
        <div class="user-badge">
            <div class="avatar" id="avatarInitial">?</div>
            <div class="badge-info">
                <div class="badge-name" id="badgeName">Loading...</div>
                <div class="badge-email" id="badgeEmail">—</div>
            </div>
            <span class="badge-role" id="badgeRole">FARMER</span>
        </div>

        <form id="profileForm" autocomplete="off">

            <div class="section-label"><i class="fas fa-user"></i> Account Info</div>
            <div class="form-grid">

                <div class="form-group full">
                    <label for="name"><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="name" placeholder="Your full name" required>
                </div>

                <div class="form-group full">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" placeholder="Email" readonly title="Email cannot be changed">
                </div>

                <div class="form-group full">
                    <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. +91 98765 43210">
                </div>

            </div>

            <div class="section-label"><i class="fas fa-tractor"></i> Farm Details</div>
            <div class="form-grid">

                <div class="form-group">
                    <label for="soilType"><i class="fas fa-mountain"></i> Soil Type</label>
                    <select id="soilType">
                        <option value="">Select soil type</option>
                        <option value="Black Soil">Black Soil</option>
                        <option value="Red Soil">Red Soil</option>
                        <option value="Alluvial Soil">Alluvial Soil</option>
                        <option value="Clay Soil">Clay Soil</option>
                        <option value="Sandy Soil">Sandy Soil</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="landSize"><i class="fas fa-ruler-combined"></i> Land Size (acres)</label>
                    <input type="number" id="landSize" placeholder="e.g. 5.5" min="0" step="0.01">
                </div>

                <div class="form-group">
                    <label for="language"><i class="fas fa-globe"></i> Preferred Language</label>
                    <select id="language">
                        <option value="English">English</option>
                        <option value="Telugu">Telugu (తెలుగు)</option>
                        <option value="Hindi">Hindi (हिन्दी)</option>
                    </select>
                </div>

            </div>

            <button type="submit" class="save-btn" id="saveBtn">
                <i class="fas fa-cloud-upload-alt"></i>
                Save Profile to Cloud
            </button>

            <div class="alert success" id="successAlert">
                <i class="fas fa-check-circle"></i>
                <span id="successMsg">Profile saved successfully to MongoDB!</span>
            </div>
            <div class="alert error" id="errorAlert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMsg">Something went wrong. Please try again.</span>
            </div>

        </form>

        <a href="dashboard.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>

    </div>

    <script>
    (function () {
        'use strict';

        const API_BASE = '';   // same origin
        const token = localStorage.getItem('jwt_token');

        // ── Auth guard ────────────────────────────────────────────
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        // ── DOM refs ──────────────────────────────────────────────
        const overlay      = document.getElementById('loadingOverlay');
        const loadingText  = document.getElementById('loadingText');
        const nameEl       = document.getElementById('name');
        const emailEl      = document.getElementById('email');
        const phoneEl      = document.getElementById('phone');
        const soilEl       = document.getElementById('soilType');
        const landEl       = document.getElementById('landSize');
        const langEl       = document.getElementById('language');
        const saveBtn      = document.getElementById('saveBtn');
        const successAlert = document.getElementById('successAlert');
        const errorAlert   = document.getElementById('errorAlert');
        const successMsg   = document.getElementById('successMsg');
        const errorMsg     = document.getElementById('errorMsg');

        function showLoading(text) {
            loadingText.textContent = text || 'Loading...';
            overlay.classList.add('show');
        }
        function hideLoading() { overlay.classList.remove('show'); }

        function showSuccess(msg) {
            successMsg.textContent = msg;
            successAlert.classList.add('show');
            errorAlert.classList.remove('show');
            setTimeout(() => successAlert.classList.remove('show'), 4000);
        }
        function showError(msg) {
            errorMsg.textContent = msg;
            errorAlert.classList.add('show');
            successAlert.classList.remove('show');
        }

        function updateBadge(user) {
            const initials = (user.name || 'U').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
            document.getElementById('avatarInitial').textContent = initials || '?';
            document.getElementById('badgeName').textContent = user.name || 'Farmer';
            document.getElementById('badgeEmail').textContent = user.email || '—';
            const roleMap = { USER: 'FARMER', VET: 'VET', ADMIN: 'ADMIN' };
            document.getElementById('badgeRole').textContent = roleMap[user.role] || 'FARMER';
        }

        // ── LOAD PROFILE FROM MONGODB ─────────────────────────────
        async function loadProfile() {
            showLoading('Loading your profile...');
            try {
                const res = await fetch(API_BASE + '/api/user/profile', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (res.status === 401) {
                    localStorage.removeItem('jwt_token');
                    window.location.href = 'login.html';
                    return;
                }

                if (!res.ok) {
                    throw new Error('Server error: ' + res.status);
                }

                const user = await res.json();

                // Populate form fields
                nameEl.value  = user.name     || '';
                emailEl.value = user.email    || '';
                phoneEl.value = user.phone    || '';
                soilEl.value  = user.soilType || '';
                landEl.value  = user.landSize != null ? user.landSize : '';
                langEl.value  = user.language || 'English';

                updateBadge(user);

            } catch (err) {
                console.error('Load profile error:', err);
                // Fall back to JWT claims for basic info
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    emailEl.value = payload.sub || '';
                    document.getElementById('badgeEmail').textContent = payload.sub || '—';
                } catch (_) {}
                showError('Could not load profile from server. You can still save your details.');
            } finally {
                hideLoading();
            }
        }

        // ── SAVE PROFILE TO MONGODB ───────────────────────────────
        document.getElementById('profileForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const name     = nameEl.value.trim();
            const phone    = phoneEl.value.trim();
            const soilType = soilEl.value;
            const landSize = landEl.value ? parseFloat(landEl.value) : null;
            const language = langEl.value;

            if (!name) {
                showError('Full name is required.');
                return;
            }

            saveBtn.disabled = true;
            showLoading('Saving to cloud...');

            try {
                const res = await fetch(API_BASE + '/api/user/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ name, phone, soilType, landSize, language })
                });

                if (res.status === 401) {
                    localStorage.removeItem('jwt_token');
                    window.location.href = 'login.html';
                    return;
                }

                const data = await res.json();

                if (res.ok) {
                    // Also update badge immediately
                    updateBadge({ name, email: emailEl.value, role: 'USER' });
                    // Mirror to localStorage so dashboard sidebar shows updated values
                    const lsKey = 'agriverse_user_' + emailEl.value;
                    let cached = {};
                    try { cached = JSON.parse(localStorage.getItem(lsKey) || '{}'); } catch (_) {}
                    localStorage.setItem(lsKey, JSON.stringify({ ...cached, name, phone, soilType, landSize, language }));
                    // Also update legacy key for dashboard.js sidebar
                    localStorage.setItem('userProfile', JSON.stringify({ name, email: emailEl.value, phone, soilType, landSize, language }));
                    showSuccess('✅ Profile saved to MongoDB successfully!');
                } else {
                    showError(data.message || 'Failed to save. Try again.');
                }
            } catch (err) {
                console.error('Save profile error:', err);
                showError('Network error. Check your connection and try again.');
            } finally {
                saveBtn.disabled = false;
                hideLoading();
            }
        });

        // Kick off load on page ready
        loadProfile();

    })();
    </script>

</body>
</html>
