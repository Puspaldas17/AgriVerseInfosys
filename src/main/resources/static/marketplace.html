<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVerse - Farmer Marketplace</title>
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #16a34a;
            --primary-hover: #15803d;
            --bg-body: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 50%, #f8fafc 100%);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: white;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--primary-green);
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-primary {
            background: var(--primary-green);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Header Area */
        .marketplace-header {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-title h1 {
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* Filters & Search */
        .filters-container {
            max-width: 1200px;
            margin: 0 auto 2rem;
            padding: 1.5rem;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .search-row {
            display: flex;
            gap: 1rem;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .state-select {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: white;
            outline: none;
            min-width: 200px;
        }

        .category-pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pill {
            padding: 0.5rem 1.25rem;
            border-radius: 999px;
            background: var(--bg-body);
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .pill:hover {
            background: #e2e8f0;
        }

        .pill.active {
            background: #dcfce7;
            color: var(--primary-green);
            border-color: #bbf7d0;
        }

        /* Results Grid */
        .results-meta {
            max-width: 1200px;
            margin: 0 auto 1rem;
            padding: 0 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        /* Product Card */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .crop-icon {
            width: 48px;
            height: 48px;
            background: #f0fdf4;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .organic-tag {
            background: #dcfce7;
            color: var(--primary-green);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .card-price {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary-green);
            margin-bottom: 1rem;
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-item i {
            width: 16px;
            text-align: center;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: inherit;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .search-row {
                flex-direction: column;
            }
            .marketplace-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">
            <i class="fas fa-leaf"></i> SC AgriVerse
        </a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="#">About</a>
            <select class="btn btn-outline" style="padding: 4px 8px; font-size:0.85rem;">
                <option>English</option>
                <option>Hindi</option>
            </select>
            <button class="btn btn-outline"><i class="fas fa-bell"></i></button>
            <a href="login.html" class="btn btn-outline">Farmer Login</a>
            <a href="dashboard.html" class="btn btn-primary">Get Started</a>
        </div>
    </nav>

    <!-- Header -->
    <div class="marketplace-header">
        <div class="header-title">
            <h1><a href="dashboard.html" style="color:inherit; text-decoration:none;"><i class="fas fa-arrow-left"></i></a> Farmer Marketplace <i class="fas fa-shopping-cart text-green"></i></h1>
            <p>All-India direct farm-to-consumer produce listings</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="renderListings()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button class="btn btn-primary" onclick="openPostModal()"><i class="fas fa-plus"></i> Post Listing</button>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-container">
        <div class="search-row">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search crop, city or seller...">
            </div>
            <select id="stateSelect" class="state-select">
                <option value="All">All States</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Punjab">Punjab</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Gujarat">Gujarat</option>
            </select>
        </div>
        <div class="category-pills" id="categoryPills">
            <div class="pill active" data-cat="All">All</div>
            <div class="pill" data-cat="Grain">Grain</div>
            <div class="pill" data-cat="Vegetable">Vegetable</div>
            <div class="pill" data-cat="Fruit">Fruit</div>
            <div class="pill" data-cat="Spice">Spice</div>
            <div class="pill" data-cat="Pulse">Pulse</div>
            <div class="pill" data-cat="Other">Other</div>
        </div>
    </div>

    <!-- Results Meta -->
    <div class="results-meta">
        <span id="resultCount">0 listings found</span>
        <span id="organicCount" style="color:var(--primary-green); font-weight:600;"><i class="fas fa-leaf"></i> 0 organic</span>
    </div>

    <!-- Grid -->
    <div class="grid-container" id="listingsGrid">
        <!-- JS will inject cards here -->
    </div>

    <!-- Modals -->
    <!-- Contact Modal -->
    <div class="modal-overlay" id="contactModal">
        <div class="modal-content">
            <i class="fas fa-times modal-close" onclick="closeContactModal()"></i>
            <h2 class="modal-title">Contact Seller</h2>
            <div style="background:var(--bg-body); padding:1rem; border-radius:8px; margin-bottom:1rem;">
                <h3 id="modalSellerName" style="margin-bottom:4px;">Seller Name</h3>
                <p id="modalCropInfo" class="text-muted" style="font-size:0.9rem;">Crop Info</p>
            </div>
            <div class="form-group">
                <label>Your Message</label>
                <textarea rows="4" placeholder="Hi, I am interested in buying..."></textarea>
            </div>
            <button class="btn btn-primary btn-block" onclick="sendContactMessage()"><i class="fas fa-paper-plane"></i> Send Message</button>
        </div>
    </div>

    <!-- Post Listing Modal -->
    <div class="modal-overlay" id="postModal">
        <div class="modal-content" style="max-height:90vh; overflow-y:auto;">
            <i class="fas fa-times modal-close" onclick="closePostModal()"></i>
            <h2 class="modal-title">Create New Listing</h2>
            
            <div class="form-group">
                <label>Crop Name</label>
                <input type="text" id="postCrop" placeholder="e.g. Tomatoes">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="postCategory">
                    <option value="Vegetable">Vegetable</option>
                    <option value="Fruit">Fruit</option>
                    <option value="Grain">Grain</option>
                    <option value="Spice">Spice</option>
                    <option value="Pulse">Pulse</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price (₹ per kg/quintal)</label>
                <input type="text" id="postPrice" placeholder="e.g. ₹2000 per quintal">
            </div>
            <div class="form-group">
                <label>Location (City, State)</label>
                <input type="text" id="postLocation" placeholder="e.g. Nashik, Maharashtra">
            </div>
            <div class="form-group">
                <label>Quantity Available</label>
                <input type="text" id="postQuantity" placeholder="e.g. 500 kg">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="postOrganic">
                <label for="postOrganic" style="margin:0;">Certified Organic Product</label>
            </div>
            <button class="btn btn-primary btn-block" onclick="submitListing()"><i class="fas fa-check"></i> Post Listing</button>
        </div>
    </div>

    <script src="js/marketplace.js"></script>
</body>
</html>
